name: probe
on:
  push:
    branches: ["arena/85ccd86f-fumio"]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: probe tv-ui
        run: |
          npm install --no-save jsdom
          node -e "console.log('jsdom at', require.resolve('jsdom'))"
          NODE_PATH=node_modules node docs/tv-ui.test.cjs || echo "TVUI_EXIT=$?"
          NODE_PATH=node_modules node docs/offline-screen.test.cjs || echo "OFF_EXIT=$?"
      - name: probe emulator tools
        run: |
          which adb emulator avdmanager sdkmanager || true
          adb version || true
          avdmanager list device | head -20 || true
