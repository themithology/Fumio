name: Build Android APK

# This sandbox that develops TheOGPirateBot has no Android SDK/Gradle and no network
# route to Google's / Gradle's download hosts, so the APK cannot be built
# locally in that environment. GitHub Actions runners have full internet
# access and the standard Android toolchain, so the APK is built here
# instead, on every push to this branch (or manually via workflow_dispatch).

on:
  push:
    branches:
      - "arena/**"
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # GitHub's ubuntu-latest runners ship the Android SDK pre-installed
      # (ANDROID_HOME, platforms, build-tools, licenses already accepted) —
      # no separate setup-android action needed.
      - name: Sync web build into the Android project
        run: npx cap sync android

      # The in-app updater compares this integer with the number in the release
      # tag (theogpiratebot-apk-<run_number>), so every published APK knows how
      # old it is without parsing semver or dates. Same number in both places.
      - name: Build debug APK
        working-directory: android
        env:
          OGPB_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee /tmp/gradle.log || {
            echo "### Gradle failure" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            sed -n '/What went wrong/,/^\* Try/p' /tmp/gradle.log | head -70 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            # Compile errors first (the useful ones), then whatever else broke.
            grep -nE "^e: |error:|Caused by:" /tmp/gradle.log | head -30 \
              | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      # The job summary is not always enough (some failures are only visible in
      # the raw log), so the log travels with the run when the build breaks.
      - name: Upload gradle log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: /tmp/gradle.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: theogpiratebot-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Attach APK to a rolling "latest-apk" release
        if: github.ref_name == github.event.repository.default_branch || startsWith(github.ref_name, 'arena/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: theogpiratebot-apk-${{ github.run_number }}
          name: "TheOGPirateBot debug APK #${{ github.run_number }} (${{ github.ref_name }}@${{ github.sha }})"
          body: "TheOGPirateBot debug APK. Commit ${{ github.sha }}. versionCode ${{ github.run_number }}\n\nInstalls over the previous build (keeping downloads and settings), and the app offers this update by itself."
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
