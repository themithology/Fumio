<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Continue with Google — TheOGPirateBot</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #050505; color: #f4f4f5; font-family: ui-sans-serif, system-ui, sans-serif; }
      main { min-height: 100svh; display: grid; place-items: center; padding: 24px; }
      .card { width: min(420px, 100%); border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.04); border-radius: 24px; padding: 28px 22px; text-align: center; }
      h1 { margin: 0 0 8px; font-size: 1.4rem; }
      p { margin: 0 0 22px; color: #a1a1aa; font-size: 14px; line-height: 1.5; }
      button { width: 100%; min-height: 48px; border: 0; border-radius: 14px; background: #fff; color: #111; font-weight: 800; font-size: 15px; }
      button:disabled { opacity: .55; }
      .err { margin-top: 14px; color: #fca5a5; font-size: 13px; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.18.0/firebase-auth-compat.js"></script>
  </head>
  <body>
    <main>
      <div class="card">
        <h1>Continue with Google</h1>
        <p id="copy">Opening Google in this browser. One tap signs you into the app.</p>
        <button id="go" type="button">Continue with Google</button>
        <p class="err" id="err" hidden></p>
      </div>
    </main>
    <script>
      (function () {
        const params = new URLSearchParams(location.search);
        const redirect = params.get("redirect") || "com.fumio.app://auth";
        const errEl = document.getElementById("err");
        const copy = document.getElementById("copy");
        const btn = document.getElementById("go");
        const show = (msg) => { errEl.hidden = false; errEl.textContent = msg; };

        firebase.initializeApp({
          apiKey: "AIzaSyDapNgnKdO8l_t7BJPCO8IsbL73aILA1cI",
          authDomain: "ogpb-331d5.firebaseapp.com",
          projectId: "ogpb-331d5",
          appId: "1:352929408479:web:20fd9158e4a414f77f906a",
        });
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();

        const sendHome = async (result) => {
          const cred = firebase.auth.GoogleAuthProvider.credentialFromResult(result);
          const token = cred && cred.idToken;
          if (!token) throw new Error("Google did not return an ID token.");
          copy.textContent = "Signed in. Returning to the app…";
          btn.hidden = true;
          try {
            await fetch("/done?idToken=" + encodeURIComponent(token), { method: "POST", keepalive: true });
          } catch (e) {}
          location.assign(redirect + (redirect.indexOf("?") >= 0 ? "&" : "?") + "idToken=" + encodeURIComponent(token));
        };

        let starting = false;
        const start = () => {
          if (starting) return;
          starting = true;
          btn.disabled = true;
          auth.signInWithRedirect(provider).catch((err) => {
            starting = false;
            btn.disabled = false;
            show(err.message || String(err));
          });
        };

        btn.addEventListener("click", start);

        auth.getRedirectResult()
          .then((result) => {
            if (result && result.user) return sendHome(result);
            start();
          })
          .catch((err) => show(err.message || String(err)));
      })();
    </script>
  </body>
</html>
